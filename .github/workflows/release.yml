name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  validate-windows:
    name: Validate Windows scripts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter "*.ps1" -File | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  Write-Host "Parser errors in $($_.Name):"
                  $parseErrors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $failed = $true
              }
          }
          if ($failed) {
              exit 1
          }

  release:
    name: Test and release
    needs: validate-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable ZIP
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git archive \
            --format=zip \
            --prefix=WatchFrog/ \
            --output="WatchFrog-${TAG_NAME}.zip" \
            HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            "WatchFrog-${TAG_NAME}.zip" \
            --generate-notes \
            --title "WatchFrog ${TAG_NAME}"
