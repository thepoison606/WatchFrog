[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchfrog"
version = "0.1.4"
description = "Monitor audio streams for received digital silence"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
watchfrog = "watchfrog:main"

[tool.setuptools]
py-modules = ["watchfrog"]

[tool.setuptools.data-files]
"share/watchfrog" = ["config.example.toml"]
